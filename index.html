<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido</title>
</head>

<body>
    <div id="conteudo">
        <h2>Aceita Namorar Comigo ?</h2>
        <div class="botoes">
            <button id="sm" onclick="sim()">Sim</button>
            <button id="btn" type="button">Não</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
</body>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    #conteudo {
        left: 0;
        top: 0;
        background-color: #f56969;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        position: fixed;
        padding: clamp(12px, 4vw, 28px);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 4vw, 28px);
        overflow: hidden;
    }

    h2 {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: clamp(1.5rem, 5.5vw, 2.4rem);
        line-height: 1.25;
        max-width: 21ch;
        color: #1a1a1a;
        padding: 2px;
    }

    .botoes {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(10px, 3vw, 18px);
        justify-content: center;
        align-items: center;
    }

    #btn,
    #sm {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: clamp(1rem, 3.5vw, 1.35rem);
        min-width: clamp(88px, 28vw, 120px);
        min-height: 48px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    #btn {
        color: black;
        background-color: rgb(255, 0, 17);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #sm {
        background-color: #e8f5e9;
        color: #1b5e20;
        font-style: oblique;
    }

    @media (max-width: 480px) {

        #btn,
        #sm {
            min-height: 52px;
            width: min(160px, 42vw);
        }
    }

    @media (orientation: landscape) and (max-height: 500px) {
        #conteudo {
            gap: 12px;
            padding: 10px;
        }

        h2 {
            font-size: clamp(1.1rem, 4vh, 1.6rem);
        }
    }
</style>

<script>
    function sim() {
        Swal.fire({
            title: 'Parabéns !!',
            text: 'Você aceitou namorar comigo 😛',
            imageWidth: 100,
            imageHeight: 100,
            background: '#000',
            color: '#fff'
        });
    }

    function desvia(btn, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        var margem = 12;
        var maxLeft = window.innerWidth - btn.offsetWidth - margem;
        var maxTop = window.innerHeight - btn.offsetHeight - margem;

        btn.style.position = 'fixed';
        btn.style.left = geraPosicao(margem, Math.max(margem, maxLeft)) + 'px';
        btn.style.top = geraPosicao(margem, Math.max(margem, maxTop)) + 'px';
        btn.style.bottom = 'auto';
        btn.style.right = 'auto';
        console.log('opa, desviei');
    }

    function geraPosicao(min, max) {
        return Math.floor(Math.random() * (max - min + 1) + min);
    }

    function manterNaTela() {
        if (btnNao.style.position !== 'fixed') return;

        var margem = 12;
        var maxLeft = window.innerWidth - btnNao.offsetWidth - margem;
        var maxTop = window.innerHeight - btnNao.offsetHeight - margem;
        var left = parseFloat(btnNao.style.left) || margem;
        var top = parseFloat(btnNao.style.top) || margem;

        btnNao.style.left = Math.min(Math.max(left, margem), Math.max(margem, maxLeft)) + 'px';
        btnNao.style.top = Math.min(Math.max(top, margem), Math.max(margem, maxTop)) + 'px';
    }

    var btnNao = document.getElementById('btn');

    btnNao.addEventListener('mouseover', function (e) {
        desvia(btnNao, e);
    });

    btnNao.addEventListener('touchstart', function (e) {
        desvia(btnNao, e);
    }, { passive: false });

    btnNao.addEventListener('click', function (e) {
        e.preventDefault();
        desvia(btnNao, e);
    });

    window.addEventListener('resize', manterNaTela);
    window.addEventListener('orientationchange', manterNaTela);
</script>

</html>
